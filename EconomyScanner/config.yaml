ServerId: main
ScanIntervalMinutes: 60
InitialDelaySeconds: 20
BarricadesPerFrame: 200

IncludeOnlinePlayerInventories: true
IncludeWorldStorage: true
IncludeVehicleStorage: true
IncludePlacedBarricades: true
IncludePlacedStructures: true
IncludeUngrouped: true

SaveSnapshotLocally: true
SaveHistoricalSnapshots: false
SnapshotFileName: latest-snapshot.json

UploadEnabled: false
ApiEndpoint: ""
# Optional. If blank and ApiEndpoint ends with /economy-snapshot, the plugin automatically uses /economy-claim.
ClaimEndpoint: ""
# Optional HTTPS endpoint. Blank derives /economy-player-link from ApiEndpoint.
PlayerLinkEndpoint: ""
# Lightweight online roster: 5-minute heartbeat and joins/leaves within ~10 seconds.
# Requires UploadEnabled. Blank endpoint derives /economy-presence from ApiEndpoint.
PresenceEnabled: true
PresenceEndpoint: ""
ApiHeaderName: X-Economy-Key
ApiKey: ""
ApiTimeoutSeconds: 15

VerboseLogging: true
