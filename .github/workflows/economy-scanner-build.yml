name: Build EconomyScanner OpenMod

on:
  push:
    branches: [ "economy-scanner" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EconomyScanner/EconomyScanner.csproj

      - name: Build OpenMod plugin
        run: dotnet build EconomyScanner/EconomyScanner.csproj -c Release --no-restore

      - name: Upload OpenMod plugin
        uses: actions/upload-artifact@v4
        with:
          name: EconomyScanner-OpenMod
          path: |
            EconomyScanner/bin/Release/netstandard2.1/EconomyScanner.dll
            EconomyScanner/bin/Release/*.nupkg
          if-no-files-found: error
