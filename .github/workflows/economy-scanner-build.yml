name: Build EconomyScanner

on:
  push:
    branches: [ "economy-scanner" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EconomyScanner/EconomyScanner.csproj

      - name: Build
        run: dotnet build EconomyScanner/EconomyScanner.csproj -c Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: EconomyScanner-plugin
          path: EconomyScanner/bin/Release/net461/EconomyScanner.dll
          if-no-files-found: error
